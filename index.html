<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Страница технически не может отправить данные на чужой адрес: всё только с того же сайта. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Pult</title>
  <meta name="description" content="Surf camp economics: price, costs and your take for every camp. Works offline, camps stay on your device.">
  <!-- Превью ссылки в Telegram и соцсетях. Адреса полные: сборщики превью не понимают относительные. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pult">
  <meta property="og:title" content="Pult — surf camp economics">
  <meta property="og:description" content="Price, costs and your take for every camp. Works offline, camps stay on your device.">
  <meta property="og:url" content="https://stasokoleso.github.io/surf-pult/">
  <meta property="og:image" content="https://stasokoleso.github.io/surf-pult/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pult: surf camp economics">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Pult">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Полоса статуса в цвет листа на телефоне. -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161C1B" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="./ui/styles.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
